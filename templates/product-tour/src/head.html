<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product tour</title>
<style>
  html, body { margin: 0; height: 100%; background: #e6e6ea; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
"use strict";
// =====================================================================
//  PRODUCT TOUR template — 16:9, 22s @ 120 BPM, 24fps. Fixed-hero journey (F5), pages crossfade in a window.
//  Logo plinth → one real screen toured (whole screen, feature, button, click) → a closer look → end title.
//  Replace SHOT_LIST, cues, acts and board with the new piece's, and src/scenes.js's pages with its screens.
// =====================================================================
const FPS = 24, W = 1920, H = 1080;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 22.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 60, bottom: 60, right: 60 };
const CX = W / 2;
const HAND = "\"Helvetica Neue\", Arial, sans-serif";

// [t0, scene, tag number, tag label]
const SHOT_LIST = [
  [0.0,  'logo',   '',   ''],
  [3.0,  'home',   '01', 'find the feature'],
  [11.0, 'detail', '02', 'see what it does'],
  [18.0, 'end',    '',   ''],
];
const SCENE = {};   // filled by src/scenes.js
const ERA_LIST = SHOT_LIST.map(([t0, sc], i) => [t0, i + 1 < SHOT_LIST.length ? SHOT_LIST[i + 1][0] : DURATION, () => SCENE[sc](i)]);
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'F5',
  shots: SHOT_LIST.map(([t0, sc, n, tag], i) => ({ id: i + 1, key: sc, era: i, t0, t1: ERA_LIST[i][1], title: (n ? n + ' ' + tag : sc) })),
  cuts: SHOT_LIST.slice(1).map(([t0]) => t0),
  morphs: [],
  anchor: { t0: 3.0, t1: 18.0, x: 300, y: 711, tolerance: 45, minShare: 0.85 },
  cues: {
    logo: 0.15, botIn: 0.5,
    navClick: 6.0, buttonClick: 9.75,
    hush: 16.0, allow: 17.0,
    endIn: 18.0, title: 18.6,
  },
  acts: [
    { name: '1 Logo',     role: 'build',   t0: 0.0,  t1: 3.0 },
    { name: '2 Tour',     role: 'journey', t0: 3.0,  t1: 16.0 },
    { name: '3 Hush',     role: 'silence', t0: 16.0, t1: 17.0 },
    { name: '4 Payoff',   role: 'gift',    t0: 17.0, t1: 18.0 },
    { name: '5 Goodbye',  role: 'goodbye', t0: 18.0, t1: 22.0 },
  ],
  board: [
    { t: 1.8,  title: 'logo', sound: 'soft pluck', next: 'fade' },
    { t: 5.0,  title: '01 the screen', sound: 'groove', next: 'fade' },
    { t: 9.0,  title: '01 the button', sound: 'groove', next: 'fade' },
    { t: 14.0, title: '02 a closer look', sound: 'thins', next: 'hush' },
    { t: 17.4, title: '02 done', sound: 'loudest hit', next: 'cut' },
    { t: 20.5, title: 'end', sound: 'decay', next: 'loops' },
  ],
  narration: [],
};
window.TIMELINE = TIMELINE;
